name: Release Windows

# Build .exe non signé + publication sur GitHub Releases.
# Déclenché par un tag "vX.Y.Z" (push), ou manuellement pour tester le build
# sans publier (workflow_dispatch → artifact seulement, pas de release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Empaqueter le .zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          STAGING="quickpaint-windows-x64"
          mkdir -p "$STAGING"
          cp target/release/quickpaint.exe "$STAGING/"
          cp README.md "$STAGING/" 2>/dev/null || true
          cat > "$STAGING/LISEZMOI.txt" <<'EOF'
          QuickPaint pour Windows — build non signé.

          Windows SmartScreen peut afficher un avertissement "Windows a
          protégé votre ordinateur" au premier lancement : c'est normal pour
          un exécutable sans certificat de signature payant. Cliquez sur
          "Informations complémentaires" puis "Exécuter quand même".
          EOF
          7z a "${STAGING}.zip" "$STAGING"

      - name: Upload artifact (build manuel)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: quickpaint-windows-x64
          path: quickpaint-windows-x64.zip

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: quickpaint-windows-x64.zip
          name: QuickPaint ${{ env.VERSION }} (Windows)
          body: |
            Build Windows non signé de QuickPaint ${{ env.VERSION }}.

            SmartScreen affichera un avertissement au premier lancement
            (pas de certificat de signature de code) — cliquez sur
            « Informations complémentaires → Exécuter quand même ».
          draft: true
