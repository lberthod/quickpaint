[package]
name = "quickpaint"
version = "0.19.0"
edition = "2021"
description = "QuickPaint — éditeur de dessin tactile macOS en Rust (egui)"
authors = ["Loïc Berthod <https://github.com/lberthod>"]
homepage = "https://github.com/lberthod/quickpaint"
repository = "https://github.com/lberthod/quickpaint"
license = "MIT"

[dependencies]
# "accesskit" : arbre d'accessibilité natif (VoiceOver) construit automatiquement
# par egui à partir des widgets (boutons, libellés, curseurs) — UIX_ANALYSE.md U2.
# "glow" explicite : depuis eframe 0.30+, "wgpu" est devenu le backend par
# défaut (bascule silencieuse de rendu, cf. sprint.md Sprint N — décision
# d'architecture délibérément hors scope de cette migration). `glow` reste
# le backend historique de ce projet ; default-features désactivées pour ne
# PAS tirer "wgpu" en même temps (sinon `Renderer::default()` retomberait
# quand même sur Wgpu, cf. eframe::epi::Renderer).
eframe = { version = "0.34", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "web_screen_reader", "x11"] }
egui = { version = "0.34" }
# Icônes vectorielles (barre d'outils, calques, menus) — police Phosphor
# embarquée, rendu net à toute taille, sans dépendre des emojis du système.
egui-phosphor = { version = "0.12", features = ["fill"] }
# Encodage images pour l'export (PNG/JPG/WebP/GIF). default-features off = build léger.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "gif"] }
# Sauvegarde / ouverture de projet vectoriel (.json, étape 7).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Boîtes de dialogue natives (ouvrir / enregistrer).
rfd = "0.15"
# Encodage base64 des images embarquées dans le projet (.json).
base64 = "0.22"
# Rastérisation CPU pour le compositing par calque (modes de fusion, #8).
tiny-skia = "0.11"
# Presse-papiers (coller une image, ⌘V) — cas d'usage « comparer 2 images ».
arboard = "3"
fontdb = { version = "0.23.0", default-features = false, features = ["fs", "memmap"] }
geo-clipper = "0.9.0"
geo-types = "0.7.19"
psd = "0.3.5"
# Barre de menu macOS native (NSMenu) — UIX_ANALYSE.md U1/Sprint A : menu ⌘
# (À propos, Quitter, Services) reconnu par le système, absent d'un menu
# `egui::menu_button` custom.
muda = "0.19"
# Désactive le menu ⌘ par défaut de winit (`with_default_menu`), qui sinon
# écrase silencieusement le nôtre après `PaintApp::new` — même version que
# celle utilisée en interne par `eframe` 0.34 (winit 0.30), pour rester sur
# le même type d'`EventLoopBuilder`. Reconfirmé après migration egui 0.29→0.34
# (sprint.md T4) : eframe 0.34 embarque toujours winit 0.30.x en interne.
winit = { version = "0.30", default-features = false }
usvg = "0.47.0"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

# Métadonnées pour cargo-bundle (section 8 de l'architecture)
[package.metadata.bundle]
name = "QuickPaint"
identifier = "com.lberthod.quickpaint"
category = "public.app-category.graphics-design"
copyright = "© Loïc Berthod"
